runner:
  num_steps_per_env: 24
  obs_groups:
    actor: [policy]
    critic: [policy, privileged]
  save_interval: 100
  algorithm:
    class_name: PPO
    optimizer: adam
    learning_rate: 0.0003
    num_learning_epochs: 5
    num_mini_batches: 4
  actor:
    class_name: MLPModel
    hidden_dims: [256, 256, 256]
    activation: elu
    distribution_cfg:
      class_name: GaussianDistribution
  critic:
    class_name: MLPModel
    hidden_dims: [256, 256, 256]
    activation: elu
